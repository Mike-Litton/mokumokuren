[workspace]
resolver = "2"
members = ["mmk-core", "mmk-git", "mmk-config", "mmk-cli"]

[workspace.package]
version = "0.0.0"
edition = "2021"
authors = ["Mike Litton"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlitton/mmk"
homepage = "https://github.com/mlitton/mmk"
rust-version = "1.80"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
