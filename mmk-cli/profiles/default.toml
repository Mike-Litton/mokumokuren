# mokumokuren.toml — analysis configuration for this repository.
#
# `ignore` is a list of glob patterns. Files matching any pattern are
# excluded from the hotspot ranking. Patterns are unioned with any
# `--ignore` flags on the command line.
#
# The block below lists common ecosystem patterns. Uncomment the ones
# that apply to this repo. Patterns mokumokuren can't predict (project-
# specific generated dirs, app-specific vendored trees, build outputs)
# go in the same list.
#
# If your project is a JS/TS monorepo, `mmk init --profile js-ts`
# ships an opinionated set of ecosystem defaults.
# `--profile rust|python|go` exist for those ecosystems too.

ignore = [
    # Translations — bulk localization commits aren't maintenance signal.
    # "**/*.po",
    # "**/*.pot",
    # "**/locale/**",
    # "**/Localization/**",

    # Vendored / third-party code you don't author.
    # "vendor/**",
    # "thirdparty/**",
    # "third_party/**",
    # "node_modules/**",
    # "Pods/**",

    # Lockfiles — usually rewritten in bulk by package managers.
    # "Cargo.lock",
    # "package-lock.json",
    # "yarn.lock",
    # "pnpm-lock.yaml",
    # "go.sum",
    # "poetry.lock",
    # "Gemfile.lock",

    # Generated / build output (only relevant if your repo tracks them).
    # "**/*.generated.*",
    # "**/*_pb2.py",
    # "**/*.pb.go",
    # "target/**",
    # "build/**",
    # "dist/**",

    # Engine asset / scene files (Godot, Unity, Unreal). Line counts on
    # serialized scene data don't mean anything.
    # "**/*.tscn",
    # "**/*.tres",
    # "**/*.unity",
    # "**/*.uasset",
    # "**/*.umap",
]

# `[coupling]` controls COUPLING findings emitted by `mmk review` and
# `mmk pre-edit`. `threshold` is the minimum Jaccard a partner must
# reach to fire as a "missed partner" warning. Default: 0.30.
#
# `ignore_partners` is a glob list of paths that never trigger a
# COUPLING finding as the missed partner — useful for files that
# legitimately co-change but shouldn't be demanded (sibling-workspace
# manifests, generated artifacts).
#
# Run `mmk eval --sample 50` to measure the noise floor on this repo
# and decide whether to raise the threshold.

# [coupling]
# threshold = 0.30
# ignore_partners = []

# `[blast_radius]` controls the 1-hop co-change neighborhood emitted
# by `--blast-radius <PATH>`. The threshold is the minimum Jaccard a
# partner file must reach to be included. Default: 0.10.
#
# Lower than `[coupling] threshold` on purpose: blast-radius is the
# exploratory query, where surfacing faint signal is the point.

# [blast_radius]
# threshold = 0.10

# `[health.ts]` enables the TypeScript Health adapter:
# - `test_pair` flags an impl edit whose test partner isn't in the
#   diff (research-anchored: prevents the easy "edit code, skip
#   tests" path that LLM coding evals consistently catch).
# - `broad_exception` flags newly-added broad catch handlers (the
#   EVASION sensor, arXiv:2509.13941).
# - `test_weakening` (v0.13) flags net erosion of an existing test:
#   skip decorators added, assertions lost, mocks added, etc.
#   Targets arXiv:2503.15223 *"Are 'Solved Issues' in SWE-bench
#   Really Solved Correctly?"*.
# Off by default outside the js-ts profile so non-TS users aren't
# surprised.

# [health.ts]
# enabled = true
# patterns = ["test_pair", "broad_exception", "test_weakening"]

# `[bulk]` carries the per-diff guardrails: `max_files` / `max_lines`
# silence HOTSPOT/COUPLING when a diff exceeds the cap. The numbers
# are internal calibration — bump for repos with naturally wider
# commit grain. Agent-context guardrail; not tied to any published
# review-effectiveness number.
[bulk]
max_files            = 15
max_lines            = 1000
