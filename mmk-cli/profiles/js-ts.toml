# mokumokuren.toml — JS/TS profile.
#
# Derived from the v0.3 four-repo eval. Catches the documented noise
# patterns: workspace-package.json constellation, lockfile bulk
# rewrites, generated artifacts, build/release config.

ignore = [
    "**/node_modules/**",
    "**/dist/**",
    "**/build/**",
    "**/.next/**",
    "**/coverage/**",
    "**/*.generated.*",
    "**/*.d.ts",
    "package-lock.json",
    "pnpm-lock.yaml",
    "yarn.lock",
]

[coupling]
confidence_threshold = 0.20
min_sample_size = 1
ignore_partners = [
    "**/package.json",
    "**/*-lock.json",
    "**/*-lock.yaml",
    "**/.yarnrc*",
    "**/Fastfile",
    "**/pubspec.yaml",
    "**/openapi*.json",
    "**/*.generated.*",
]

[blast_radius]
threshold = 0.10

# v0.4 Health adapter: structural-pattern findings for TS files.
# Surfaces architectural neighbors the empirical co-change cone
# can't see (e.g. preferences.contribution.ts as a precedent for
# extensions.contribution.ts even when they have no commit overlap).
[health.ts]
enabled = true
patterns = ["registration", "service", "test_pair"]
