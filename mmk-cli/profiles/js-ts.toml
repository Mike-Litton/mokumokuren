# mokumokuren.toml — JS/TS profile.
#
# Catches the typical noise patterns: workspace-package.json
# constellation, lockfile bulk rewrites, generated artifacts,
# build/release config.

ignore = [
    "**/node_modules/**",
    "**/dist/**",
    "**/build/**",
    "**/.next/**",
    "**/coverage/**",
    "**/*.generated.*",
    "**/*.d.ts",
    # Lockfiles — bare-name globs miss nested workspace lockfiles.
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/yarn.lock",
    # Yarn 4 vendors its release binary under .yarn/; pollutes
    # hotspot rank if not excluded.
    ".yarn/**",
]

# `[bulk]` carries two diff-time guardrails calibrated independently:
# `max_files` / `max_lines` are the per-diff cap (agentic-context
# safety); `review_quality_lines` is the review-effectiveness floor
# (defect-detection during review degrades sharply past ~200 LOC).
# Mirrored here so the defaults are visible — set
# `review_quality_lines = 0` to disable the floor.
[bulk]
max_files            = 15
max_lines            = 1000
review_quality_lines = 200  # review-effectiveness floor

[coupling]
confidence_threshold = 0.20
min_sample_size = 1
ignore_partners = [
    "**/package.json",
    "**/*-lock.json",
    "**/*-lock.yaml",
    "**/.yarnrc*",
    "**/Fastfile",
    "**/pubspec.yaml",
    "**/openapi*.json",
    "**/*.generated.*",
    # Auto-generated release notes — not co-edits an agent should
    # be expected to produce.
    "**/CHANGELOG.md",
    "**/CHANGELOG_archive.md",
]

[blast_radius]
threshold = 0.10

# Health adapter: structural-pattern findings for TS / JS files.
# Surfaces architectural neighbors the empirical co-change cone
# can't see (e.g. an `*.contribution.ts` file as a precedent for a
# sibling `*.contribution.ts` even when they have no commit overlap).
# `broad_exception` adds the EVASION sensor: detects newly-added
# non-top-level broad catch handlers (empty body, no parameter,
# any/unknown/Error type, or log-and-swallow shape) — the failure
# mode named in arXiv:2509.13941 *(An Empirical Study on Failures
# in Automated Issue Solving)*. v0.12 adds `broad_catch_debt`: the
# audit-mode static count counterpart, surfaced under `mmk audit`
# only (review/pre-edit silently drop it).
[health.ts]
enabled = true
patterns = ["registration", "service", "test_pair", "broad_exception", "broad_catch_debt"]

# Optional sub-block — tunes the log-and-swallow predicate shared
# by `broad_exception` (delta-mode) and `broad_catch_debt`
# (static-mode). Default identifiers cover pino-style (`logger`),
# winston-style (`log`), and the browser fallback (`console`).
# Extend with project-specific names; replacing the list overrides
# the defaults.
# [health.ts.broad_exception]
# log_identifiers = ["logger", "log", "console", "appLog"]

# Role-file patterns: STRUCTURE demotes Warn → Info on these. The
# block below mirrors the in-code defaults so an agent reading the
# config can see what's exempted; extend with repo-specific suffixes
# (e.g. "*Resolver", "*.gateway"). Each pattern is a stem-suffix
# match: `*<suffix>` matches when the file stem (before its final
# extension) ends with `<suffix>`. `mmk eval --replay` STRUCTURE
# fire counts surface candidate suffixes.
[sensor.structure]
role_patterns = [
    "*.contribution", "*Factory", "*.action", "*.actions",
    "*Registry", "*.module", "*Module", "*.routes", "*.config",
    "*extension", "*index", "*.barrel", "*Barrel",
]
