# mokumokuren.toml — JS/TS profile.
#
# Catches the typical noise patterns: workspace-package.json
# constellation, lockfile bulk rewrites, generated artifacts,
# build/release config.

ignore = [
    "**/node_modules/**",
    "**/dist/**",
    "**/build/**",
    "**/.next/**",
    "**/coverage/**",
    "**/*.generated.*",
    "**/*.d.ts",
    # Lockfiles — bare-name globs miss nested workspace lockfiles.
    "**/package-lock.json",
    "**/pnpm-lock.yaml",
    "**/yarn.lock",
    # Yarn 4 vendors its release binary under .yarn/; pollutes
    # hotspot rank if not excluded.
    ".yarn/**",
]

[coupling]
confidence_threshold = 0.20
min_sample_size = 1
ignore_partners = [
    "**/package.json",
    "**/*-lock.json",
    "**/*-lock.yaml",
    "**/.yarnrc*",
    "**/Fastfile",
    "**/pubspec.yaml",
    "**/openapi*.json",
    "**/*.generated.*",
    # Auto-generated release notes — not co-edits an agent should
    # be expected to produce.
    "**/CHANGELOG.md",
    "**/CHANGELOG_archive.md",
]

[blast_radius]
threshold = 0.10

# Health adapter: structural-pattern findings for TS / JS files.
# Surfaces architectural neighbors the empirical co-change cone
# can't see (e.g. an `*.contribution.ts` file as a precedent for a
# sibling `*.contribution.ts` even when they have no commit overlap).
# `broad_exception` adds the EVASION sensor: detects newly-added
# non-top-level broad catch handlers (empty body, no parameter, or
# any/unknown/Error type) — the failure mode named in
# arXiv:2509.13941 *(An Empirical Study on Failures in Automated
# Issue Solving)*.
[health.ts]
enabled = true
patterns = ["registration", "service", "test_pair", "broad_exception"]

# Role-file patterns: STRUCTURE demotes Warn → Info on these. The
# block below mirrors the in-code defaults so an agent reading the
# config can see what's exempted; extend with repo-specific suffixes
# (e.g. "*Resolver", "*.gateway"). Each pattern is a stem-suffix
# match: `*<suffix>` matches when the file stem (before its final
# extension) ends with `<suffix>`. `mmk eval --replay` STRUCTURE
# fire counts surface candidate suffixes.
[sensor.structure]
role_patterns = [
    "*.contribution", "*Factory", "*.action", "*.actions",
    "*Registry", "*.module", "*Module", "*.routes", "*.config",
    "*extension", "*index", "*.barrel", "*Barrel",
]
