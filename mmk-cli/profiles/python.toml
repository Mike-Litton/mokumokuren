# mokumokuren.toml — Python profile.

ignore = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/.venv/**",
    "**/venv/**",
    "**/.tox/**",
    "**/dist/**",
    "**/build/**",
    "**/*.egg-info/**",
    "poetry.lock",
    "Pipfile.lock",
    "uv.lock",
]

[coupling]
confidence_threshold = 0.20
min_sample_size = 1
