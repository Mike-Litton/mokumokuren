# mokumokuren.toml — Python profile.

ignore = [
    "**/__pycache__/**",
    "**/*.pyc",
    "**/.venv/**",
    "**/venv/**",
    "**/.tox/**",
    "**/dist/**",
    "**/build/**",
    "**/*.egg-info/**",
    "poetry.lock",
    "Pipfile.lock",
    "uv.lock",
]

[coupling]
confidence_threshold = 0.20
min_sample_size = 1

# `[bulk]` carries the per-diff guardrails: `max_files` / `max_lines`
# silence the history-graph layers when a diff exceeds the cap
# (agent-context guardrail; internal calibration, not a published
# threshold). Mirrored here so the defaults are visible.
[bulk]
max_files            = 15
max_lines            = 1000
