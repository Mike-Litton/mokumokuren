[package]
name = "mokumokuren"
description = "Evidence-based Git health metrics for humans and LLM agents."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "mokumokuren"
path = "src/bin/mokumokuren.rs"

[[bin]]
name = "mmk"
path = "src/bin/mmk.rs"

[lints]
workspace = true

[dependencies]
mmk-core = { path = "../mmk-core" }
mmk-git = { path = "../mmk-git" }
mmk-config = { path = "../mmk-config" }
mmk-health = { path = "../mmk-health" }
ahash = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
globset = { workspace = true }
humantime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Optional heap profiler. Off by default; enable for diagnostic runs
# only — `cargo build --release --features dhat-heap`. See
# `docs/performance.md` § Measuring.
dhat = { version = "0.3", optional = true }

[features]
# Swaps in dhat's global allocator and a Profiler that writes
# dhat-heap.json on exit. Wired in src/bin/mmk.rs behind `cfg(feature)`.
dhat-heap = ["dep:dhat"]

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.{ archive-format }"
pkg-fmt = "tgz"
