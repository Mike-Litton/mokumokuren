# mokumokuren.toml — analysis config for the mmk repository itself.
#
# Patterns here are unioned with any `--ignore` flags on the command
# line. Run `mmk init` in a fresh repo to scaffold the same template
# that started this file.

ignore = [
    # `cargo update` rewrites this in bulk; the churn is mechanical, not
    # maintenance signal.
    "Cargo.lock",
    # Generated by `dist init` (cargo-dist). Re-running it rewrites the
    # whole file — that's a tooling event, not engineering work.
    ".github/workflows/release.yml",
]
